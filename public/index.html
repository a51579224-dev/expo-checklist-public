  // ===== 철수 정산 탭: 남은 재고 / 일별 매출 / 판매내역 업로드(베타) / 개선사항 =====
  function renderSettlementPanel(container, ev) {
    renderRemainingStockSection(container, ev);
    renderDailyRevenueSection(container, ev);
    renderPosUploadSection(container, ev);
    renderImprovementNotesSection(container, ev);
  }

  // 가져간 CTN/PC를 "1CTN=boxQty PCS" 기준으로 낱개 총수량 하나로 환산(박스당 수량 미입력이면 CTN은 못 더함).
  function takenTotalPc(it) {
    const takenCtn = it.ctnActual ?? it.ctnPlanned ?? null;
    const takenPc = it.pcActual ?? it.pcPlanned ?? null;
    if (takenCtn === null && takenPc === null) return null;
    return (takenCtn || 0) * (it.boxQty || 0) + (takenPc || 0);
  }

  function renderRemainingStockSection(container, ev) {
    const sec = document.createElement("div");
    sec.className = "settle-section";
    sec.innerHTML = `<div class="settle-section-title">① 남은 재고</div>`;
    const invCat = ev.categories.find((c) => c.id === "inventory");
    const items = invCat ? invCat.items : [];

    if (items.length === 0) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.style.margin = "0";
      hint.textContent = "'상품 재고' 탭에 등록된 품목이 없어요. 먼저 그쪽에서 가져갈 상품을 등록해주세요.";
      sec.appendChild(hint);
      container.appendChild(sec);
      return;
    }

    if (remainingStockCategoryView === null) {
      sec.appendChild(buildCategoryDashboard(items, (cat) => { remainingStockCategoryView = cat; renderDetail(); }));
      container.appendChild(sec);
      return;
    }
    sec.appendChild(buildCategoryBackBtn(() => { remainingStockCategoryView = null; renderDetail(); }));
    const titleEl = document.createElement("div");
    titleEl.className = "cat-drilled-title";
    titleEl.textContent = `${PRODUCT_CATEGORY_ICONS[remainingStockCategoryView] || "📦"} ${remainingStockCategoryView}`;
    sec.appendChild(titleEl);

    const catItems = items.filter((it) => itemCategory(it) === remainingStockCategoryView);
    catItems.forEach((it) => {
      const row = document.createElement("div");
      row.className = "settle-row";

      const taken = takenTotalPc(it);

      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = it.text;

      const takenEl = document.createElement("span");
      takenEl.className = "taken";
      takenEl.textContent = taken === null ? "가져간 수량 미입력" : `가져간 ${taken}개`;

      const soldInput = numInput(it.soldPc, "0");
      soldInput.addEventListener("change", async () => {
        await fetch(`${API}/${currentSlug}/categories/inventory/items/${it.id}`, {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ soldPc: soldInput.value }),
        });
        await refreshDetail();
      });

      row.append(nameEl, takenEl, span("unit", "판매"), soldInput, span("unit", "개"));

      if (it.soldPc !== null && it.soldPc !== undefined && taken !== null) {
        const remain = taken - it.soldPc;
        row.appendChild(span("sold-est", `→ 남은 수량: ${remain}개`));
      }
      sec.appendChild(row);
    });

    container.appendChild(sec);
  }

  function renderDailyRevenueSection(container, ev) {
    const sec = document.createElement("div");
    sec.className = "settle-section";
    const title = document.createElement("div");
    title.className = "settle-section-title";
    title.textContent = "② 일별 매출";
    sec.appendChild(title);

    const revenue = (ev.settlement && ev.settlement.revenue) || {};
    const grid = document.createElement("div");
    grid.className = "settle-revenue-grid";

    const mk = (key, label) => {
      const wrap = document.createElement("div");
      const lbl = document.createElement("label");
      lbl.textContent = label;
      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.placeholder = "원";
      if (revenue[key] !== null && revenue[key] !== undefined) input.value = revenue[key];
      wrap.append(lbl, input);
      return { wrap, input };
    };
    const fri = mk("fri", "금요일");
    const sat = mk("sat", "토요일");
    const sun = mk("sun", "일요일");
    grid.append(fri.wrap, sat.wrap, sun.wrap);
    sec.appendChild(grid);

    const total = document.createElement("div");
    total.className = "settle-revenue-total";
    const sumFn = () => {
      const n = (v) => (v === "" ? 0 : Number(v) || 0);
      return n(fri.input.value) + n(sat.input.value) + n(sun.input.value);
    };
    total.textContent = `3일 합계: ${sumFn().toLocaleString()}원`;
    sec.appendChild(total);

    const save = async (key, input) => {
      await fetch(`${API}/${currentSlug}/settlement`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [key]: input.value }),
      });
      total.textContent = `3일 합계: ${sumFn().toLocaleString()}원`;
    };
    fri.input.addEventListener("change", () => save("revenueFri", fri.input));
    sat.input.addEventListener("change", () => save("revenueSat", sat.input));
    sun.input.addEventListener("change", () => save("revenueSun", sun.input));

    container.appendChild(sec);
  }

  function renderPosUploadSection(container, ev) {
    const sec = document.createElement("div");
    sec.className = "settle-section";
    const title = document.createElement("div");
    title.className = "settle-section-title";
    title.textContent = "③ 품목별 판매 내역";
    sec.appendChild(title);

    const box = document.createElement("div");
    box.className = "settle-pos-upload";
    box.innerHTML = `<div class="settle-beta-hint">베타 기능입니다. 엑셀 파일 형식에 따라 일부 항목을 불러오지 못할 수 있으니, 정리 결과를 원본과 확인해주세요.</div>`;

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".xlsx,.xls";
    const uploadBtn = document.createElement("button");
    uploadBtn.className = "small";
    uploadBtn.style.marginLeft = "8px";
    uploadBtn.textContent = "판매내역 올리기";
    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) { alert("엑셀 파일을 먼저 선택해주세요."); return; }
      uploadBtn.disabled = true;
      uploadBtn.textContent = "읽는 중...";
      try {
        const base64 = await fileToBase64(file);
        const res = await fetch(`${API}/${currentSlug}/settlement/pos-upload`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fileName: file.name, fileDataBase64: base64 }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.error || "업로드에 실패했어요.");
        }
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "판매내역 올리기";
        await refreshDetail();
      }
    });
    box.append(fileInput, uploadBtn);

    const pos = ev.settlement && ev.settlement.pos;
    if (pos) {
      const meta = document.createElement("div");
      meta.className = "hint";
      meta.style.marginTop = "10px";
      meta.textContent = `마지막 업로드: ${escapeHtml(pos.fileName || "")} (${new Date(pos.uploadedAt).toLocaleString("ko-KR")})`;
      box.appendChild(meta);

      if (!pos.recognized) {
        const warn = document.createElement("div");
        warn.className = "settle-uncertain";
        warn.textContent = pos.message || "표 형식을 인식하지 못했어요.";
        box.appendChild(warn);
      } else if (pos.summary && pos.summary.length > 0) {
        const table = document.createElement("table");
        table.className = "settle-table";
        table.innerHTML = `
          <thead><tr><th>품목</th><th style="text-align:right">수량</th><th style="text-align:right">금액</th></tr></thead>
          <tbody>${pos.summary.map((r) => `<tr><td>${escapeHtml(r.name)}</td><td class="num">${r.qty.toLocaleString()}</td><td class="num">${r.amount.toLocaleString()}원</td></tr>`).join("")}</tbody>
        `;
        box.appendChild(table);
      }

      if (pos.uncertain && pos.uncertain.length > 0) {
        const warn = document.createElement("div");
        warn.className = "settle-uncertain";
        warn.innerHTML = `⚠️ ${escapeHtml(pos.message || "일부 행을 자동으로 읽지 못했어요.")} 원본에서 직접 확인해주세요.<pre>${escapeHtml(JSON.stringify(pos.uncertain.slice(0, 15), null, 1))}</pre>`;
        box.appendChild(warn);
      }
    }

    sec.appendChild(box);
    container.appendChild(sec);
  }

  function renderImprovementNotesSection(container, ev) {
    const sec = document.createElement("div");
    sec.className = "settle-section";
    const title = document.createElement("div");
    title.className = "settle-section-title";
    title.textContent = "④ 다음 행사 개선사항";
    sec.appendChild(title);

    const textarea = document.createElement("textarea");
    textarea.className = "settle-notes";
    textarea.placeholder = "다음엔 이렇게 바꿔보자 — 자유롭게 적어주세요.";
    textarea.value = (ev.settlement && ev.settlement.improvementNotes) || "";
    textarea.addEventListener("blur", async () => {
      await fetch(`${API}/${currentSlug}/settlement`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ improvementNotes: textarea.value }),
      });
    });
    sec.appendChild(textarea);
    container.appendChild(sec);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1] || "");
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ===== 행사 계약 탭: 부스위치 / 배치도+마커 / 차량 입차시간 =====
  function renderContractPanel(container, ev) {
    // 1) 부스 번호 · 부스 위치
    const sec1 = document.createElement("div");
    sec1.className = "contract-section";
    sec1.innerHTML = `
      <div class="contract-section-title">① 부스 위치 및 부스 번호</div>
      <div class="hint" style="margin-top:0">부스 번호: <b>${escapeHtml(ev.boothCount || "미입력 (상단 '정보 수정'에서 입력)")}</b></div>
      <label>부스 위치 (예: 제1전시장 A홀, 출입구 오른쪽)</label>
      <input type="text" id="cp-booth-location" value="${escapeHtml(ev.boothLocation || "")}" placeholder="예: 제1전시장 A홀, A-15 인근" />
      <button class="small" id="cp-booth-location-save" style="margin-top:8px">저장</button>
    `;
    container.appendChild(sec1);
    sec1.querySelector("#cp-booth-location-save").addEventListener("click", async () => {
      const boothLocation = sec1.querySelector("#cp-booth-location").value.trim();
      await fetch(`${API}/${currentSlug}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ boothLocation }),
      });
      await refreshDetail();
    });

    // 2) 부스 배치도
    const sec2 = document.createElement("div");
    sec2.className = "contract-section";
    sec2.innerHTML = `<div class="contract-section-title">② 부스 배치도</div>`;
    container.appendChild(sec2);
    renderFloorPlanSection(sec2, ev);

    // 3) 차량 입차 가능 시간
    const va = ev.vehicleAccess || {};
    const sec3 = document.createElement("div");
    sec3.className = "contract-section";
    sec3.innerHTML = `
      <div class="contract-section-title">③ 차량 입차 가능 시간</div>
      <label>차량 반입 날짜 *</label>
      <input type="date" id="cp-va-date" value="${escapeHtml(va.date || "")}" />
      <label>입차 시간 (선택)</label>
      <input type="time" id="cp-va-start" value="${escapeHtml(va.startTime || "")}" />
      <label>입차 마감 시간 *</label>
      <input type="time" id="cp-va-end" value="${escapeHtml(va.endTime || "")}" />
      <label>진열 마감 시간 (선택)</label>
      <input type="time" id="cp-va-display" value="${escapeHtml(va.displayDeadline || "")}" />
      <button class="small" id="cp-va-save" style="margin-top:8px">저장</button>
      <div class="error" id="cp-va-error"></div>
      <div id="cp-va-stats"></div>
    `;
    container.appendChild(sec3);
    if (va.date && va.endTime) sec3.querySelector("#cp-va-stats").appendChild(buildVehicleStats(va));
    sec3.querySelector("#cp-va-save").addEventListener("click", async () => {
      const date = sec3.querySelector("#cp-va-date").value;
      const startTime = sec3.querySelector("#cp-va-start").value;
      const endTime = sec3.querySelector("#cp-va-end").value;
      const displayDeadline = sec3.querySelector("#cp-va-display").value;
      const errEl = sec3.querySelector("#cp-va-error");
      if (!date || !endTime) { errEl.textContent = "반입 날짜와 입차 마감 시간은 필수예요."; return; }
      errEl.textContent = "";
      const res = await fetch(`${API}/${currentSlug}/vehicle-access`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date, startTime, endTime, displayDeadline }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = "❌ " + (data.error || "저장 실패"); return; }
      await refreshDetail();
    });
  }

  // 차량 입차/입차마감/진열마감 3개를 큰 숫자 타일로 보여줌 — 값 없는 항목은 "미정"
  function buildVehicleStats(va) {
    const wrap = document.createElement("div");
    wrap.className = "va-stats";
    const tiles = [
      ["입차", va.startTime],
      ["입차 마감", va.endTime],
      ["진열 마감", va.displayDeadline],
    ];
    tiles.forEach(([label, time]) => {
      const tile = document.createElement("div");
      tile.className = "va-stat";
      tile.innerHTML = `<span class="num">${escapeHtml(time || "미정")}</span><span class="lbl">${escapeHtml(label)}</span>`;
      wrap.appendChild(tile);
    });
    return wrap;
  }

  function floorPlanImageSrc(fp) {
    return (fp && (fp.imageDataUrl || fp.imageUrl)) || null;
  }

  // targetEl 안에 배치도 이미지+마커(또는 업로드 폼)를 그린다. big=true면 모달(크게보기)용.
  function buildFloorPlanView(targetEl, ev, { big = false } = {}) {
    targetEl.innerHTML = "";
    const fp = ev.floorPlan;
    const src = floorPlanImageSrc(fp);
    if (!src) {
      if (big) return; // 모달은 이미지 있을 때만 열림
      targetEl.innerHTML = `
        <div class="hint" style="margin-top:0">아직 배치도가 없어요. 공식 홈페이지 이미지 링크를 넣거나, 파일을 업로드해주세요.</div>
        <button class="secondary small" id="fp-auto-find" style="margin-bottom:10px">🔎 공식 배치도 자동으로 찾기 (준비중)</button>
        <label>이미지 링크(URL)</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="fp-url-input" placeholder="https://..." style="flex:1" />
          <button class="small" id="fp-url-load" style="white-space:nowrap">불러오기</button>
        </div>
        <label>또는 파일 업로드</label>
        <input type="file" id="fp-file-input" accept="image/*" />
      `;
      targetEl.querySelector("#fp-auto-find").addEventListener("click", () => {
        alert("준비 중인 기능이에요. 지금은 위에서 이미지 링크나 파일을 직접 올려주세요.");
      });
      wireFloorPlanUploadControls(targetEl);
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "fp-wrap";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "부스 배치도";
    img.addEventListener("error", () => {
      wrap.innerHTML = "";
      const msg = document.createElement("div");
      msg.className = "hint";
      msg.style.margin = "10px";
      msg.textContent = "❌ 이미지를 불러올 수 없어요(링크가 만료됐거나 외부 표시가 막혀있을 수 있어요). 파일을 직접 업로드해주세요.";
      wrap.appendChild(msg);
    });
    wrap.appendChild(img);

    if (typeof fp.markerX === "number" && typeof fp.markerY === "number") {
      const marker = document.createElement("div");
      marker.className = "fp-marker";
      marker.style.left = fp.markerX * 100 + "%";
      marker.style.top = fp.markerY * 100 + "%";
      wrap.appendChild(marker);
    }

    wrap.addEventListener("click", async (e) => {
      const rect = img.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      await saveFloorPlan({ imageUrl: fp.imageUrl || null, imageDataUrl: fp.imageDataUrl || null, markerX: x, markerY: y });
    });

    targetEl.appendChild(wrap);

    if (!big) {
      const actions = document.createElement("div");
      actions.className = "fp-actions";
      const bigBtn = document.createElement("button");
      bigBtn.className = "secondary";
      bigBtn.textContent = "🔍 크게 보기";
      bigBtn.addEventListener("click", () => openFloorPlanModal());
      actions.appendChild(bigBtn);

      const autoMarkBtn = document.createElement("button");
      autoMarkBtn.className = "secondary";
      autoMarkBtn.textContent = "🤖 부스 번호 자동 인식 (준비중)";
      autoMarkBtn.addEventListener("click", () => {
        alert("준비 중인 기능이에요. 지금은 배치도를 탭/클릭해서 직접 위치를 표시해주세요.");
      });
      actions.appendChild(autoMarkBtn);

      if (typeof fp.markerX === "number") {
        const clearMarkerBtn = document.createElement("button");
        clearMarkerBtn.className = "secondary";
        clearMarkerBtn.textContent = "마커 삭제";
        clearMarkerBtn.addEventListener("click", async () => {
          await saveFloorPlan({ imageUrl: fp.imageUrl || null, imageDataUrl: fp.imageDataUrl || null, markerX: null, markerY: null });
        });
        actions.appendChild(clearMarkerBtn);
      }

      const removeImgBtn = document.createElement("button");
      removeImgBtn.className = "secondary";
      removeImgBtn.textContent = "배치도 삭제";
      removeImgBtn.addEventListener("click", async () => {
        if (!confirm("배치도 이미지를 삭제할까요? (마커 위치도 같이 사라져요)")) return;
        await fetch(`${API}/${currentSlug}/floor-plan`, { method: "DELETE" });
        await refreshDetail();
      });
      actions.appendChild(removeImgBtn);
      targetEl.appendChild(actions);
    }
  }

  function wireFloorPlanUploadControls(targetEl) {
    const urlInput = targetEl.querySelector("#fp-url-input");
    const urlBtn = targetEl.querySelector("#fp-url-load");
    const fileInput = targetEl.querySelector("#fp-file-input");

    urlBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      await saveFloorPlan({ imageUrl: url, imageDataUrl: null, markerX: null, markerY: null });
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const dataUrl = await downscaleImageFile(file, 1600, 0.82);
      await saveFloorPlan({ imageUrl: null, imageDataUrl: dataUrl, markerX: null, markerY: null });
    });
  }

  function downscaleImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function saveFloorPlan(payload) {
    const res = await fetch(`${API}/${currentSlug}/floor-plan`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (res.ok) {
      await refreshDetail();
      const modal = document.getElementById("floorplan-modal");
      if (modal.style.display !== "none") {
        buildFloorPlanView(document.getElementById("fp-modal-wrap"), currentEvent, { big: true });
      }
    }
  }

  function renderFloorPlanSection(container, ev) {
    const holder = document.createElement("div");
    container.appendChild(holder);
    buildFloorPlanView(holder, ev);
  }

  function openFloorPlanModal() {
    const modal = document.getElementById("floorplan-modal");
    const wrap = document.getElementById("fp-modal-wrap");
    buildFloorPlanView(wrap, currentEvent, { big: true });
    modal.style.display = "flex";
  }

  document.getElementById("fp-modal-close").addEventListener("click", () => {
    document.getElementById("floorplan-modal").style.display = "none";
  });

  async function toggleItem(catId, itemId, done) {
    await fetch(`${API}/${currentSlug}/categories/${catId}/items/${itemId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done }),
    });
    await refreshDetail();
  }

  function startEditItem(catId, item, textEl) {
    const input = document.createElement("input");
    input.type = "text";
    input.value = item.text;
    input.style.flex = "1";
    const finish = async () => {
      const v = input.value.trim();
      if (v && v !== item.text) {
        await fetch(`${API}/${currentSlug}/categories/${catId}/items/${item.id}`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: v }),
        });
      }
      await refreshDetail();
    };
    input.addEventListener("blur", finish);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    textEl.replaceWith(input);
    input.focus();
    input.select();
  }

  async function deleteItem(catId, itemId) {
    if (!confirm("이 항목을 삭제할까요?")) return;
    await fetch(`${API}/${currentSlug}/categories/${catId}/items/${itemId}`, { method: "DELETE" });
    await refreshDetail();
  }

  async function moveItem(cat, idx, dir) {
    const ids = cat.items.map((it) => it.id);
    const target = idx + dir;
    if (target < 0 || target >= ids.length) return;
    [ids[idx], ids[target]] = [ids[target], ids[idx]];
    await fetch(`${API}/${currentSlug}/categories/${cat.id}/reorder`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ itemIds: ids }),
    });
    await refreshDetail();
  }

  document.getElementById("new-item-add").addEventListener("click", async () => {
    const input = document.getElementById("new-item-text");
    const text = input.value.trim();
    if (!text) return;
    await fetch(`${API}/${currentSlug}/categories/${currentCatId}/items`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    });
    input.value = "";
    await refreshDetail();
  });

  document.getElementById("dt-copy").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("dt-link").textContent).then(() => {
      const el = document.getElementById("dt-copied");
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 1500);
    });
  });

  document.getElementById("dt-edit-toggle").addEventListener("click", () => {
    const form = document.getElementById("dt-edit-form");
    if (form.style.display === "none") {
      document.getElementById("ed-name").value = currentEvent.name;
      edRange = { start: currentEvent.startDate || "", end: currentEvent.endDate || "" };
      attachRangePicker(document.getElementById("ed-period"), edRange.start, edRange.end, (s, e) => { edRange = { start: s, end: e }; });
      document.getElementById("ed-location").value = currentEvent.location || "";
      document.getElementById("ed-booth").value = currentEvent.boothCount || "";
      form.style.display = "block";
    } else {
      form.style.display = "none";
    }
  });

  document.getElementById("ed-save").addEventListener("click", async () => {
    const payload = {
      name: document.getElementById("ed-name").value.trim(),
      startDate: edRange.start,
      endDate: edRange.end,
      location: document.getElementById("ed-location").value.trim(),
      boothCount: document.getElementById("ed-booth").value.trim(),
    };
    if (!payload.name) { alert("행사명을 입력해주세요."); return; }
    await fetch(`${API}/${currentSlug}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    document.getElementById("dt-edit-form").style.display = "none";
    await refreshDetail();
  });

  document.getElementById("dup-toggle").addEventListener("click", () => {
    const form = document.getElementById("dup-form");
    if (form.style.display === "none") {
      document.getElementById("dup-name").value = currentEvent.name + " (다음 행사)";
      dupRange = { start: "", end: "" };
      attachRangePicker(document.getElementById("dup-period"), "", "", (s, e) => { dupRange = { start: s, end: e }; });
      form.style.display = "block";
    } else {
      form.style.display = "none";
    }
  });

  document.getElementById("dup-submit").addEventListener("click", async () => {
    const newName = document.getElementById("dup-name").value.trim();
    if (!newName) { alert("새 행사명을 입력해주세요."); return; }
    const payload = {
      newName,
      startDate: dupRange.start,
      endDate: dupRange.end,
    };
    try {
      const res = await fetch(`${API}/${currentSlug}/duplicate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "복제 실패"); return; }
      sessionStorage.setItem("justCreated", data.event.slug);
      location.href = "/e/" + data.event.slug;
    } catch (err) {
      alert("오류: " + err.message);
    }
  });

  init();
</script>
</body>
</html>
