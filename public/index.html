        <div style="display:flex;gap:8px">
          <input type="text" id="fp-url-input" placeholder="https://..." style="flex:1" />
          <button class="small" id="fp-url-load" style="white-space:nowrap">불러오기</button>
        </div>
        <label>또는 파일 업로드</label>
        <input type="file" id="fp-file-input" accept="image/*" />
      `;
      targetEl.querySelector("#fp-auto-find").addEventListener("click", () => {
        alert("준비 중인 기능이에요. 지금은 위에서 이미지 링크나 파일을 직접 올려주세요.");
      });
      wireFloorPlanUploadControls(targetEl);
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "fp-wrap";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "부스 배치도";
    img.addEventListener("error", () => {
      wrap.innerHTML = "";
      const msg = document.createElement("div");
      msg.className = "hint";
      msg.style.margin = "10px";
      msg.textContent = "❌ 이미지를 불러올 수 없어요(링크가 만료됐거나 외부 표시가 막혀있을 수 있어요). 파일을 직접 업로드해주세요.";
      wrap.appendChild(msg);
    });
    wrap.appendChild(img);

    if (typeof fp.markerX === "number" && typeof fp.markerY === "number") {
      const marker = document.createElement("div");
      marker.className = "fp-marker";
      marker.style.left = fp.markerX * 100 + "%";
      marker.style.top = fp.markerY * 100 + "%";
      wrap.appendChild(marker);
    }

    wrap.addEventListener("click", async (e) => {
      const rect = img.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      await saveFloorPlan({ imageUrl: fp.imageUrl || null, imageDataUrl: fp.imageDataUrl || null, markerX: x, markerY: y });
    });

    targetEl.appendChild(wrap);

    if (!big) {
      const actions = document.createElement("div");
      actions.className = "fp-actions";
      const bigBtn = document.createElement("button");
      bigBtn.className = "secondary";
      bigBtn.textContent = "🔍 크게 보기";
      bigBtn.addEventListener("click", () => openFloorPlanModal());
      actions.appendChild(bigBtn);

      const autoMarkBtn = document.createElement("button");
      autoMarkBtn.className = "secondary";
      autoMarkBtn.textContent = "🤖 부스 번호 자동 인식 (준비중)";
      autoMarkBtn.addEventListener("click", () => {
        alert("준비 중인 기능이에요. 지금은 배치도를 탭/클릭해서 직접 위치를 표시해주세요.");
      });
      actions.appendChild(autoMarkBtn);

      if (typeof fp.markerX === "number") {
        const clearMarkerBtn = document.createElement("button");
        clearMarkerBtn.className = "secondary";
        clearMarkerBtn.textContent = "마커 삭제";
        clearMarkerBtn.addEventListener("click", async () => {
          await saveFloorPlan({ imageUrl: fp.imageUrl || null, imageDataUrl: fp.imageDataUrl || null, markerX: null, markerY: null });
        });
        actions.appendChild(clearMarkerBtn);
      }

      const removeImgBtn = document.createElement("button");
      removeImgBtn.className = "secondary";
      removeImgBtn.textContent = "배치도 삭제";
      removeImgBtn.addEventListener("click", async () => {
        if (!confirm("배치도 이미지를 삭제할까요? (마커 위치도 같이 사라져요)")) return;
        await fetch(`${API}/${currentSlug}/floor-plan`, { method: "DELETE" });
        await refreshDetail();
      });
      actions.appendChild(removeImgBtn);
      targetEl.appendChild(actions);
    }
  }

  function wireFloorPlanUploadControls(targetEl) {
    const urlInput = targetEl.querySelector("#fp-url-input");
    const urlBtn = targetEl.querySelector("#fp-url-load");
    const fileInput = targetEl.querySelector("#fp-file-input");

    urlBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      await saveFloorPlan({ imageUrl: url, imageDataUrl: null, markerX: null, markerY: null });
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const dataUrl = await downscaleImageFile(file, 1600, 0.82);
      await saveFloorPlan({ imageUrl: null, imageDataUrl: dataUrl, markerX: null, markerY: null });
    });
  }

  function downscaleImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function saveFloorPlan(payload) {
    const res = await fetch(`${API}/${currentSlug}/floor-plan`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (res.ok) {
      await refreshDetail();
      const modal = document.getElementById("floorplan-modal");
      if (modal.style.display !== "none") {
        buildFloorPlanView(document.getElementById("fp-modal-wrap"), currentEvent, { big: true });
      }
    }
  }

  function renderFloorPlanSection(container, ev) {
    const holder = document.createElement("div");
    container.appendChild(holder);
    buildFloorPlanView(holder, ev);
  }

  function openFloorPlanModal() {
    const modal = document.getElementById("floorplan-modal");
    const wrap = document.getElementById("fp-modal-wrap");
    buildFloorPlanView(wrap, currentEvent, { big: true });
    modal.style.display = "flex";
  }

  document.getElementById("fp-modal-close").addEventListener("click", () => {
    document.getElementById("floorplan-modal").style.display = "none";
  });

  async function toggleItem(catId, itemId, done) {
    await fetch(`${API}/${currentSlug}/categories/${catId}/items/${itemId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done }),
    });
    await refreshDetail();
  }

  function startEditItem(catId, item, textEl) {
    const input = document.createElement("input");
    input.type = "text";
    input.value = item.text;
    input.style.flex = "1";
    const finish = async () => {
      const v = input.value.trim();
      if (v && v !== item.text) {
        await fetch(`${API}/${currentSlug}/categories/${catId}/items/${item.id}`, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: v }),
        });
      }
      await refreshDetail();
    };
    input.addEventListener("blur", finish);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    textEl.replaceWith(input);
    input.focus();
    input.select();
  }

  async function deleteItem(catId, itemId) {
    if (!confirm("이 항목을 삭제할까요?")) return;
    await fetch(`${API}/${currentSlug}/categories/${catId}/items/${itemId}`, { method: "DELETE" });
    await refreshDetail();
  }

  async function moveItem(cat, idx, dir) {
    const ids = cat.items.map((it) => it.id);
    const target = idx + dir;
    if (target < 0 || target >= ids.length) return;
    [ids[idx], ids[target]] = [ids[target], ids[idx]];
    await fetch(`${API}/${currentSlug}/categories/${cat.id}/reorder`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ itemIds: ids }),
    });
    await refreshDetail();
  }

  document.getElementById("new-item-add").addEventListener("click", async () => {
    const input = document.getElementById("new-item-text");
    const text = input.value.trim();
    if (!text) return;
    await fetch(`${API}/${currentSlug}/categories/${currentCatId}/items`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    });
    input.value = "";
    await refreshDetail();
  });

  document.getElementById("dt-copy").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("dt-link").textContent).then(() => {
      const el = document.getElementById("dt-copied");
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 1500);
    });
  });

  document.getElementById("dt-edit-toggle").addEventListener("click", () => {
    const form = document.getElementById("dt-edit-form");
    if (form.style.display === "none") {
      document.getElementById("ed-name").value = currentEvent.name;
      edRange = { start: currentEvent.startDate || "", end: currentEvent.endDate || "" };
      attachRangePicker(document.getElementById("ed-period"), edRange.start, edRange.end, (s, e) => { edRange = { start: s, end: e }; });
      document.getElementById("ed-location").value = currentEvent.location || "";
      document.getElementById("ed-booth").value = currentEvent.boothCount || "";
      form.style.display = "block";
    } else {
      form.style.display = "none";
    }
  });

  document.getElementById("ed-save").addEventListener("click", async () => {
    const payload = {
      name: document.getElementById("ed-name").value.trim(),
      startDate: edRange.start,
      endDate: edRange.end,
      location: document.getElementById("ed-location").value.trim(),
      boothCount: document.getElementById("ed-booth").value.trim(),
    };
    if (!payload.name) { alert("행사명을 입력해주세요."); return; }
    await fetch(`${API}/${currentSlug}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    document.getElementById("dt-edit-form").style.display = "none";
    await refreshDetail();
  });

  document.getElementById("dup-toggle").addEventListener("click", () => {
    const form = document.getElementById("dup-form");
    if (form.style.display === "none") {
      document.getElementById("dup-name").value = currentEvent.name + " (다음 행사)";
      dupRange = { start: "", end: "" };
      attachRangePicker(document.getElementById("dup-period"), "", "", (s, e) => { dupRange = { start: s, end: e }; });
      form.style.display = "block";
    } else {
      form.style.display = "none";
    }
  });

  document.getElementById("dup-submit").addEventListener("click", async () => {
    const newName = document.getElementById("dup-name").value.trim();
    if (!newName) { alert("새 행사명을 입력해주세요."); return; }
    const payload = {
      newName,
      startDate: dupRange.start,
      endDate: dupRange.end,
    };
    try {
      const res = await fetch(`${API}/${currentSlug}/duplicate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) { alert(data.error || "복제 실패"); return; }
      sessionStorage.setItem("justCreated", data.event.slug);
      location.href = "/e/" + data.event.slug;
    } catch (err) {
      alert("오류: " + err.message);
    }
  });

  init();
</script>
</body>
</html>
