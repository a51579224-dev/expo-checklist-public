<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>박람회 체크리스트</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<style>
  :root {
    --accent: #d9822b;
    --accent-dark: #b8651a;
    --accent-light: #faf0dd;
    --text: #1c1a16;
    --muted: #8a8075;
    --border: #ead9bd;
    --ivory: #fdf8ee;
  }
  * { box-sizing: border-box; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  body {
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--ivory);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 60px;
    font-size: 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 28px; margin: 4px 0; font-weight: 800; letter-spacing: -.3px; }
  .sub { color: var(--muted); font-size: 14px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(28,22,14,.05);
  }
  label { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="date"] {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 16px; font-family: inherit; color: var(--text);
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 13px 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%;
    margin-top: 14px; transition: background .15s, transform .1s;
  }
  button:active { transform: scale(.98); }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); margin-top: 8px; }
  button.small { width: auto; font-size: 13px; padding: 8px 14px; margin: 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .error { color: #c23b2e; font-size: 14px; margin-top: 8px; }
  .bar-track { background: var(--border); border-radius: 999px; height: 12px; overflow: hidden; margin-top: 10px; }
  .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width .2s; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    background: #fff; color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .item-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .item-row input[type="checkbox"] { width: auto; margin: 0; flex-shrink: 0; }
  .item-row .txt { flex: 1; cursor: text; font-size: 16px; }
  .item-row .txt.done { text-decoration: line-through; color: var(--muted); }
  .item-row button { width: 32px; height: 32px; padding: 0; font-size: 12px; flex-shrink: 0; margin: 0; }
  .item-row button.del { width: auto; background: #fff; color: var(--text); border: 1px solid var(--border); padding: 0 10px; }
  .link-box {
    display: flex; gap: 8px; align-items: center; background: var(--accent-light);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; word-break: break-all;
  }
  .link-box code { flex: 1; }
  .copied { color: #2b8a3e; font-size: 13px; margin-top: 4px; }
  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }

  /* 탭 전환: 옆에서 밀려 들어오는 느낌(push) */
  .push-anim { animation: pushIn .22s ease; }
  @keyframes pushIn {
    from { opacity: 0; transform: translateX(18px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange { background: var(--accent); border-color: var(--accent); }
  .flatpickr-day.inRange { background: var(--accent-light); border-color: var(--accent-light); box-shadow: -5px 0 0 var(--accent-light), 5px 0 0 var(--accent-light); }

  /* 부스 배치도 */
  .contract-section { margin-bottom: 18px; }
  .contract-section:last-child { margin-bottom: 0; }
  .contract-section-title { font-weight: 800; font-size: 16px; margin-bottom: 8px; }
  .fp-wrap {
    position: relative; width: 100%; border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; background: #f1ece0; cursor: crosshair; touch-action: manipulation;
  }
  .fp-wrap img { display: block; width: 100%; height: auto; -webkit-user-drag: none; user-select: none; }
  .fp-marker {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    background: #ff3b6b; border: 3px solid #fff; box-shadow: 0 0 0 2px #ff3b6b, 0 2px 6px rgba(0,0,0,.4);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .fp-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .fp-actions button { width: auto; margin: 0; }
  .fp-modal-overlay {
    position: fixed; inset: 0; background: rgba(28,22,14,.92); z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  .fp-modal-overlay .fp-wrap { max-width: 720px; max-height: 80vh; }
  .fp-modal-overlay .fp-wrap img { max-height: 80vh; object-fit: contain; width: 100%; }
  .fp-modal-close { position: absolute; top: 16px; right: 16px; background: #fff; }
  .vehicle-badge {
    display: inline-block; background: var(--accent-light); color: var(--accent-dark); font-weight: 700;
    font-size: 13px; padding: 7px 12px; border-radius: 999px; margin-top: 8px;
  }

  /* 상품 재고: 요약 카드(대시보드 스타일 — 숫자가 한눈에 들어오게) + 품목 카드 */
  .inv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .inv-stat { background: var(--accent-light); border-radius: 12px; padding: 14px 6px; text-align: center; }
  .inv-stat .num { font-size: 28px; font-weight: 900; color: var(--accent-dark); display: block; line-height: 1.15; }
  .inv-stat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
  .inv-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .inv-filters button { width: auto; margin: 0; font-size: 13px; padding: 8px 14px; }
  .inv-filters button.secondary.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .inv-add-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .inv-add-row input { flex: 1; min-width: 160px; }
  .inv-add-row button { width: auto; white-space: nowrap; margin: 0; }
  .inv-naver-btn { background: #03c75a; } /* 네이버 브랜드 녹색 — 버튼만 구분되게, 나머지 테마는 그대로 */
  .inv-naver-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; background: var(--accent-light); }
  .inv-naver-search { display: flex; gap: 8px; margin-bottom: 10px; }
  .inv-naver-search input { flex: 1; background: #fff; }
  .inv-naver-search button { width: auto; margin: 0; white-space: nowrap; }
  .inv-naver-selectall { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 6px; cursor: pointer; }
  .inv-naver-results { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 0 10px; }
  .inv-naver-result-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); background: #fff; }
  .inv-naver-result-row:last-child { border-bottom: none; }
  .inv-naver-result-row .info { flex: 1; font-size: 14px; }
  .inv-naver-result-row .price { font-size: 13px; color: var(--muted); }
  .inv-naver-opt-badge { font-size: 11px; background: #fff3e0; color: #b45f06; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  .inv-naver-opt-wrap { flex: 1 0 100%; margin: 0 0 4px 26px; }
  .inv-naver-opt-wrap input { width: 100%; font-size: 13px; padding: 6px 10px; background: #fffdf8; }
  .inv-optgroup-wrap { display: flex; flex-direction: column; gap: 6px; }
  .inv-optgroup { border: 1px solid var(--border); border-radius: 10px; background: #fffdf8; overflow: hidden; }
  .inv-optgroup-header {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: #fffdf8; border: none; text-align: left; font-size: 13px; font-family: inherit; color: var(--text); margin: 0;
  }
  .inv-optgroup-name { flex: 1; font-weight: 700; }
  .inv-optgroup-count { color: var(--muted); font-size: 12px; }
  .inv-optgroup-chev { color: var(--muted); font-size: 11px; }
  .inv-optgroup-body { padding: 8px 10px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .inv-optgroup-addrow { display: flex; gap: 6px; }
  .inv-optgroup-addrow input { flex: 1; }
  .inv-optgroup-list { display: flex; flex-direction: column; }
  .inv-optgroup-item { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 13px; cursor: pointer; }
  .inv-optgroup-item input[type="checkbox"] { width: auto; margin: 0; }
  .inv-optgroup-item-del { width: auto; margin: 0 0 0 auto; background: none; border: none; color: var(--muted); font-size: 15px; padding: 0 4px; }
  .inv-naver-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .inv-naver-actions button { width: auto; margin: 0; }
  .inv-naver-hint { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .inv-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: #fff; }
  .inv-card.inv-dragging { opacity: .6; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .inv-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .inv-card-head .txt { flex: 1; font-size: 16px; font-weight: 700; cursor: text; }
  .inv-card-head .txt.done { text-decoration: line-through; color: var(--muted); }
  .inv-card-head button.del { width: auto; background: #fff; color: var(--text); border: 1px solid var(--border); padding: 0 10px; height: 32px; margin: 0; flex-shrink: 0; }
  .inv-drag-handle {
    flex-shrink: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
    cursor: grab; touch-action: none; background: #fff;
  }
  .inv-drag-handle:active { cursor: grabbing; background: var(--accent-light); }
  .inv-option-input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; margin-bottom: 8px; background: #fffdf8; }
  .inv-qty-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .inv-qty-row .qlbl { font-size: 13px; color: var(--muted); flex-shrink: 0; width: 44px; }
  .inv-qty-row input[type="number"] {
    width: 68px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text);
  }
  .inv-qty-row .unit { font-size: 13px; color: var(--muted); }
  .inv-total-pc { font-size: 14px; color: var(--accent-dark); font-weight: 700; margin-top: 2px; }
  .inv-diff { font-size: 13px; color: #c23b2e; margin-left: 6px; font-weight: 700; }

  /* 준비 예정: 1 CTN = N PCS / 박스 수량 → 자동계산 / 추가 PC */
  .inv-plan-wrap { margin-bottom: 8px; }
  .inv-plan-wrap .qlbl { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .inv-boxcap-row, .inv-ctn-row, .inv-extra-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .inv-boxcap-row .unit, .inv-extra-row .unit { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .inv-boxcap-input { width: 64px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text); }
  .inv-subtotal-pc { font-size: 13px; color: var(--muted); }
  .num-stepper { display: inline-flex; align-items: center; gap: 4px; }
  .num-stepper-btn {
    width: 36px; height: 36px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; font-size: 20px; line-height: 1; padding: 0; margin: 0; color: var(--text);
  }
  .num-stepper-input { width: 56px; text-align: center; padding: 7px 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text); }

  /* 준비완료 / 차량적재완료 — 카드에서 제일 크고 누르기 쉬운 버튼 */
  .inv-checks { display: flex; gap: 10px; margin: 12px 0; }
  .inv-check-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px; border: 2px solid var(--border); border-radius: 14px; background: #fff;
    font-size: 16px; font-weight: 700; color: var(--text); cursor: pointer; user-select: none; margin: 0;
  }
  .inv-check-btn input[type="checkbox"] { width: 22px; height: 22px; margin: 0; flex-shrink: 0; }
  .inv-check-btn.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .inv-note { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; }
  .inv-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }

  /* 집기: 분류(그룹)별로 묶어서 보기 */
  .sup-section-title { font-weight: 800; font-size: 17px; margin: 18px 0 10px; }
  .sup-section-title:first-child { margin-top: 0; }
  .sup-group { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .sup-group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sup-group-head .name { font-weight: 800; font-size: 16px; }
  .sup-group-head .count { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .sup-group-head button.del-group { width: auto; background: #fff; color: var(--text); border: 1px solid var(--border); padding: 0 10px; height: 30px; margin: 0; font-size: 13px; }
  .sup-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .sup-item-row:last-of-type { border-bottom: none; }
  .sup-item-row input[type="checkbox"] { width: auto; margin: 0; flex-shrink: 0; }
  .sup-item-row .txt { flex: 1; cursor: text; font-size: 16px; min-width: 90px; }
  .sup-item-row .txt.done { text-decoration: line-through; color: var(--muted); }
  .sup-item-row input[type="number"] {
    width: 64px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text); flex-shrink: 0;
  }
  .sup-item-row .unit { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .sup-item-row button.del { width: auto; background: #fff; color: var(--text); border: 1px solid var(--border); padding: 0 10px; height: 30px; margin: 0; flex-shrink: 0; font-size: 13px; }
  .sup-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .sup-add-row input { flex: 1; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
  .sup-add-row button { width: auto; margin: 0; font-size: 13px; padding: 8px 14px; white-space: nowrap; }
  .sup-new-group { border: 1px dashed var(--border); border-radius: 12px; padding: 12px; }
  .sup-new-group .sup-add-row input { min-width: 0; }

  /* 철수 정산 */
  .settle-section { margin-bottom: 22px; }
  .settle-section:last-child { margin-bottom: 0; }
  .settle-section-title { font-weight: 800; font-size: 17px; margin-bottom: 10px; }
  .settle-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .settle-row:last-of-type { border-bottom: none; }
  .settle-row .name { flex: 1; font-size: 16px; min-width: 100px; }
  .settle-row .taken { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .settle-row input[type="number"] {
    width: 64px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-weight: 700; font-family: inherit; color: var(--text); flex-shrink: 0;
  }
  .settle-row .unit { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .settle-row .sold-est { font-size: 13px; color: var(--accent-dark); flex-basis: 100%; font-weight: 700; }
  .settle-revenue-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .settle-revenue-grid label { font-size: 13px; margin: 0 0 4px; }
  .settle-revenue-grid input { width: 100%; padding: 10px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 17px; font-weight: 700; font-family: inherit; color: var(--text); }
  .settle-revenue-total { background: var(--accent-light); border-radius: 10px; padding: 12px; font-size: 18px; font-weight: 900; color: var(--accent-dark); text-align: center; }
  .settle-pos-upload { border: 1px dashed var(--border); border-radius: 12px; padding: 14px; }
  .settle-beta-hint { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; background: var(--accent-light); border-radius: 8px; padding: 9px 10px; }
  .settle-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
  .settle-table th, .settle-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  .settle-table th { color: var(--muted); font-weight: 700; font-size: 13px; }
  .settle-table td.num { text-align: right; font-weight: 700; }
  .settle-uncertain { margin-top: 10px; font-size: 13px; color: #c23b2e; }
  .settle-uncertain pre { background: #fbeee4; border-radius: 8px; padding: 8px; margin-top: 6px; white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--text); }
  textarea.settle-notes { width: 100%; min-height: 90px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; resize: vertical; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎪 박람회 체크리스트</h1>
      <div class="sub">박람회 준비물을 카테고리별로 체크하고, 행사마다 링크로 따로 관리하세요.</div>
    </header>

    <!-- 새로 만들기 화면 -->
    <div id="view-create">
      <div class="card">
        <label>행사명 *</label>
        <input type="text" id="cr-name" list="expo-name-options" placeholder="박람회명 선택 또는 직접 입력" autocomplete="off" />
        <label>행사 기간</label>
        <input type="text" id="cr-period" placeholder="기간 선택" readonly />
        <label>장소 (선택)</label>
        <input type="text" id="cr-location" list="expo-location-options" placeholder="장소 선택 또는 직접 입력" autocomplete="off" />
        <label>부스 번호 (선택)</label>
        <input type="text" id="cr-booth" placeholder="예: A-12" />
        <button id="cr-submit">체크리스트 만들기</button>
        <div class="error" id="cr-error"></div>
      </div>
      <datalist id="expo-name-options"></datalist>
      <datalist id="expo-location-options"></datalist>
      <div class="hint" style="text-align:center">
        로그인이 없어서, 만들고 나면 생기는 <b>링크를 꼭 저장(북마크/공유)</b>해두셔야 다시 들어올 수 있어요.
      </div>
    </div>

    <!-- 상세 화면 -->
    <div id="view-detail" style="display:none">
      <div class="card" id="link-reminder" style="display:none">
        <div class="hint" style="margin-top:0">이 체크리스트 주소 — 꼭 저장해두세요</div>
        <div class="link-box">
          <code id="dt-link"></code>
          <button class="secondary small" id="dt-copy">복사</button>
        </div>
        <div class="copied" id="dt-copied" style="display:none">복사했어요!</div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="font-size:18px;font-weight:800" id="dt-name">-</div>
          <button class="secondary small" id="dt-edit-toggle">정보 수정</button>
        </div>
        <div class="hint" id="dt-meta">-</div>
        <div id="dt-vehicle-summary" style="display:none"></div>
        <div class="bar-track"><div class="bar-fill" id="dt-bar"></div></div>
        <div class="hint" id="dt-progress-text">0/0 완료 (0%)</div>

        <div id="dt-edit-form" style="display:none;margin-top:14px">
          <label>행사명</label>
          <input type="text" id="ed-name" list="expo-name-options" autocomplete="off" />
          <label>행사 기간</label>
          <input type="text" id="ed-period" placeholder="기간 선택" readonly />
          <label>장소 (선택)</label>
          <input type="text" id="ed-location" list="expo-location-options" autocomplete="off" />
          <label>부스 번호 (선택)</label>
          <input type="text" id="ed-booth" />
          <button id="ed-save">저장</button>
        </div>

        <div style="margin-top:14px">
          <div class="hint" style="margin-top:0">다음 행사로 복제해서 새로 시작하기 (완료 체크만 초기화, 새 링크 발급)</div>
          <button class="secondary small" id="dup-toggle">복제하기</button>
          <div id="dup-form" style="display:none;margin-top:10px">
            <label>새 행사명</label>
            <input type="text" id="dup-name" />
            <label>행사 기간 (선택)</label>
            <input type="text" id="dup-period" placeholder="기간 선택" readonly />
            <button id="dup-submit">복제해서 새 체크리스트 만들기</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding:10px">
        <div class="tabs" id="cat-tabs"></div>
      </div>

      <div class="card">
        <div id="items-body"></div>
        <div id="add-item-row" style="display:flex;gap:8px;margin-top:12px">
          <input type="text" id="new-item-text" placeholder="새 항목 입력" style="flex:1" />
          <button class="small" id="new-item-add" style="white-space:nowrap">추가</button>
        </div>
      </div>
    </div>

    <div class="footer-note">박람회 체크리스트 · 누구나 사용 가능, 로그인 없음</div>
  </div>

  <!-- 부스 배치도 크게 보기 모달 -->
  <div id="floorplan-modal" class="fp-modal-overlay" style="display:none">
    <button class="secondary small fp-modal-close" id="fp-modal-close">닫기 ✕</button>
    <div class="fp-wrap" id="fp-modal-wrap"></div>
    <div class="hint" style="color:#fff;text-align:center;margin-top:10px">탭해서 우리 부스 위치를 표시하세요</div>
  </div>

<script>
  const API = "/api/events";
  let currentSlug = null;
  let currentEvent = null;
  let currentCatId = "contract";
  let lastAnimatedCatId = null;
  let invFilter = { onlyUnprepared: false, onlyUnloaded: false };

  // 자주 참가하는 박람회 목록 — 여기만 고치면 드롭다운에 반영됨. 목록에 없으면 직접 입력하면 됨(datalist라 자유 입력 가능).
  const EXPO_NAME_OPTIONS = [
    "궁디팡팡 캣페스타",
    "냥냥펀치 캣쇼",
    "메가주 (상)",
    "메가주 (하)",
    "가낳지모 캣페어",
    "마이캣페어",
    "케이펫페어",
    "서울펫쇼",
  ];
  const EXPO_NAME_OTHER = "기타 (직접 입력)";

  const EXPO_LOCATION_OPTIONS = [
    "킨텍스",
    "AT센터",
    "세텍",
    "부산 벡스코",
    "대구 엑스코",
    "대전컨벤션센터",
    "수원메쎄",
  ];

  function populateExpoNameOptions() {
    const dl = document.getElementById("expo-name-options");
    dl.innerHTML = [...EXPO_NAME_OPTIONS, EXPO_NAME_OTHER].map((name) => `<option value="${escapeHtml(name)}"></option>`).join("");
  }

  function populateExpoLocationOptions() {
    const dl = document.getElementById("expo-location-options");
    dl.innerHTML = EXPO_LOCATION_OPTIONS.map((loc) => `<option value="${escapeHtml(loc)}"></option>`).join("");
  }

  // "기타 (직접 입력)"를 고르면 그 글자가 그대로 남지 않도록 비워서 바로 타이핑할 수 있게 함.
  function wireExpoNameOtherClear(inputEl) {
    inputEl.addEventListener("input", () => {
      if (inputEl.value === EXPO_NAME_OTHER) inputEl.value = "";
    });
  }

  function fmtDot(iso) {
    return iso ? iso.replaceAll("-", ".") : "";
  }

  // 날짜 범위 선택 캘린더 하나를 input에 붙인다. 이미 붙어있으면 지우고 새로 붙임(폼 열 때마다 최신 값으로 리셋하려고).
  // onChange(startIso, endIso) — 둘 다 'YYYY-MM-DD' 형식, 저장/서버 전송용.
  function attachRangePicker(inputEl, startIso, endIso, onChange) {
    if (inputEl._flatpickr) inputEl._flatpickr.destroy();
    const defaultDate = [startIso, endIso].filter(Boolean);
    flatpickr(inputEl, {
      mode: "range",
      dateFormat: "Y.m.d",
      locale: { rangeSeparator: " ~ " },
      defaultDate: defaultDate.length ? defaultDate : undefined,
      onChange: (selectedDates, _dateStr, instance) => {
        const s = selectedDates[0] ? instance.formatDate(selectedDates[0], "Y-m-d") : "";
        const e = selectedDates[1] ? instance.formatDate(selectedDates[1], "Y-m-d") : "";
        onChange(s, e);
      },
    });
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function slugFromPath() {
    const m = location.pathname.match(/^\/e\/([a-zA-Z0-9]+)/);
    return m ? m[1] : null;
  }

  let crRange = { start: "", end: "" };
  let edRange = { start: "", end: "" };
  let dupRange = { start: "", end: "" };

  async function init() {
    populateExpoNameOptions();
    populateExpoLocationOptions();
    wireExpoNameOtherClear(document.getElementById("cr-name"));
    wireExpoNameOtherClear(document.getElementById("ed-name"));
    attachRangePicker(document.getElementById("cr-period"), "", "", (s, e) => { crRange = { start: s, end: e }; });
    const slug = slugFromPath();
    if (slug) {
      currentSlug = slug;
      document.getElementById("view-create").style.display = "none";
      document.getElementById("view-detail").style.display = "block";
      // 방금 만들어서 넘어온 경우만 링크 저장 안내 표시
      if (sessionStorage.getItem("justCreated") === slug) {
        document.getElementById("link-reminder").style.display = "block";
        document.getElementById("dt-link").textContent = location.origin + "/e/" + slug;
        sessionStorage.removeItem("justCreated");
      }
      await refreshDetail();
    }
  }

  // ===== 새로 만들기 =====
  document.getElementById("cr-submit").addEventListener("click", async () => {
    const name = document.getElementById("cr-name").value.trim();
    const errEl = document.getElementById("cr-error");
    if (!name) { errEl.textContent = "행사명을 입력해주세요."; return; }
    const payload = {
      name,
      startDate: crRange.start,
      endDate: crRange.end,
      location: document.getElementById("cr-location").value.trim(),
      boothCount: document.getElementById("cr-booth").value.trim(),
    };
    try {
      const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = "❌ " + (data.error || "생성 실패"); return; }
      sessionStorage.setItem("justCreated", data.event.slug);
      location.href = "/e/" + data.event.slug;
    } catch (err) {
      errEl.textContent = "❌ 오류: " + err.message;
    }
  });

  // ===== 상세 화면 =====
  async function refreshDetail() {
    try {
      const res = await fetch(`${API}/${currentSlug}`);
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("view-detail").innerHTML = `<div class="card">❌ ${escapeHtml(data.error || "불러오기 실패")}</div>`;
        return;
      }
      currentEvent = data.event;
      renderDetail();
    } catch (err) {
      alert("오류: " + err.message);
    }
  }

  // '행사 계약'/'철수 정산'은 더 이상 체크리스트가 아니고, '현장 운영'은 탭 자체가 없어짐
  // (예전 데이터만 남아있을 수 있음) — 전체 진행률 계산과 탭 목록 모두에서 제외.
  const NON_CHECKLIST_CATEGORY_IDS = new Set(["contract", "operation", "settlement"]);

  function renderDetail() {
    const ev = currentEvent;
    const progress = (() => {
      let total = 0, done = 0;
      ev.categories.forEach((c) => {
        if (NON_CHECKLIST_CATEGORY_IDS.has(c.id)) return;
        total += c.items.length;
        done += c.items.filter((it) => it.done).length;
      });
      return { total, done, percent: total === 0 ? 0 : Math.round((done / total) * 100) };
    })();
    document.getElementById("dt-name").textContent = ev.name;
    const period = [fmtDot(ev.startDate), fmtDot(ev.endDate)].filter(Boolean).join(" ~ ");
    document.getElementById("dt-meta").textContent = [period, ev.location, ev.boothCount].filter(Boolean).join(" · ") || "-";
    document.getElementById("dt-bar").style.width = progress.percent + "%";
    document.getElementById("dt-progress-text").textContent = `${progress.done}/${progress.total} 완료 (${progress.percent}%)`;

    const vSummary = document.getElementById("dt-vehicle-summary");
    const va = ev.vehicleAccess;
    if (va && va.date && va.endTime) {
      const timeText = va.startTime ? `${va.startTime}~${va.endTime}` : `${va.endTime} 까지`;
      vSummary.innerHTML = `<span class="vehicle-badge">🚚 차량 입차 — ${fmtDot(va.date)} ${timeText}</span>`;
      vSummary.style.display = "block";
    } else {
      vSummary.style.display = "none";
    }

    const tabsEl = document.getElementById("cat-tabs");
    tabsEl.innerHTML = "";
    ev.categories.forEach((c) => {
      if (c.id === "operation") return; // 탭 자체를 없앰 — 예전 데이터만 숨겨서 보존
      const btn = document.createElement("button");
      btn.className = "tab" + (c.id === currentCatId ? " active" : "");
      if (c.id === "contract" || c.id === "settlement") {
        btn.textContent = c.name; // 체크리스트가 아니라서 (완료/전체) 카운트 안 보여줌
      } else {
        const catDone = c.items.filter((it) => it.done).length;
        btn.textContent = `${c.name} (${catDone}/${c.items.length})`;
      }
      btn.addEventListener("click", () => { currentCatId = c.id; renderDetail(); });
      tabsEl.appendChild(btn);
    });

    const cat = ev.categories.find((c) => c.id === currentCatId);
    const itemsBody = document.getElementById("items-body");
    const addItemRow = document.getElementById("add-item-row");
    itemsBody.innerHTML = "";

    // 탭을 바꿨을 때만(= 같은 탭 안에서 데이터만 저장돼서 다시 그릴 때는 X) 화면이 옆에서 밀려 들어오는 효과
    if (cat.id !== lastAnimatedCatId) {
      lastAnimatedCatId = cat.id;
      const itemsCard = itemsBody.closest(".card") || itemsBody;
      itemsCard.classList.remove("push-anim");
      void itemsCard.offsetWidth; // 강제 리플로우로 애니메이션 재시작
      itemsCard.classList.add("push-anim");
    }

    if (cat.id === "contract") {
      addItemRow.style.display = "none";
      renderContractPanel(itemsBody, ev);
      return;
    }
    if (cat.id === "inventory") {
      addItemRow.style.display = "none";
      renderInventoryPanel(itemsBody, cat);
      return;
    }
    if (cat.id === "supplies") {
      addItemRow.style.display = "none";
      renderSuppliesPanel(itemsBody, cat);
      return;
    }
    if (cat.id === "settlement") {
      addItemRow.style.display = "none";
      renderSettlementPanel(itemsBody, ev);
      return;
    }
    addItemRow.style.display = "flex";

    cat.items.forEach((it, idx) => {
      const row = document.createElement("div");
      row.className = "item-row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = it.done;
      cb.addEventListener("change", () => toggleItem(cat.id, it.id, cb.checked));

      const textEl = document.createElement("span");
      textEl.className = "txt" + (it.done ? " done" : "");
      textEl.textContent = it.text;
      textEl.addEventListener("click", () => startEditItem(cat.id, it, textEl));

      const upBtn = document.createElement("button");
      upBtn.className = "secondary";
      upBtn.textContent = "▲";
      upBtn.disabled = idx === 0;
      upBtn.addEventListener("click", () => moveItem(cat, idx, -1));

      const downBtn = document.createElement("button");
      downBtn.className = "secondary";
      downBtn.textContent = "▼";
      downBtn.disabled = idx === cat.items.length - 1;
      downBtn.addEventListener("click", () => moveItem(cat, idx, 1));

      const delBtn = document.createElement("button");
      delBtn.className = "del";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", () => deleteItem(cat.id, it.id));

      row.append(cb, textEl, upBtn, downBtn, delBtn);
      itemsBody.appendChild(row);
    });
  }

  // ===== 상품 재고 탭: 품목별 준비 수량(CTN/PC) + 준비완료/차량적재완료 더블체크 =====
  function renderInventoryPanel(container, cat) {
    const items = cat.items;

    // 요약 카드
    const total = items.length;
    const preparedCount = items.filter((it) => it.done).length;
    const loadedCount = items.filter((it) => it.loaded).length;
    const percent = total === 0 ? 0 : Math.round((preparedCount / total) * 100);
    const stats = document.createElement("div");
    stats.className = "inv-stats";
    stats.innerHTML = `
      <div class="inv-stat"><span class="num">${total}</span><span class="lbl">총 품목</span></div>
      <div class="inv-stat"><span class="num">${preparedCount}</span><span class="lbl">준비완료</span></div>
      <div class="inv-stat"><span class="num">${loadedCount}</span><span class="lbl">차량적재완료</span></div>
      <div class="inv-stat"><span class="num">${percent}%</span><span class="lbl">준비율</span></div>
    `;
    container.appendChild(stats);

    // 필터
    const filters = document.createElement("div");
    filters.className = "inv-filters";
    const mkFilterBtn = (label, key) => {
      const b = document.createElement("button");
      b.className = "secondary" + (invFilter[key] ? " active" : "");
      b.textContent = label;
      b.addEventListener("click", () => {
        invFilter[key] = !invFilter[key];
        renderDetail();
      });
      return b;
    };
    filters.appendChild(mkFilterBtn("미준비만 보기", "onlyUnprepared"));
    filters.appendChild(mkFilterBtn("차량 미적재만 보기", "onlyUnloaded"));
    container.appendChild(filters);

    // 품목 추가
    const addRow = document.createElement("div");
    addRow.className = "inv-add-row";
    const addInput = document.createElement("input");
    addInput.type = "text";
    addInput.placeholder = "품목명 (예: 메가스크래쳐 84cm 내추럴)";
    const addBtn = document.createElement("button");
    addBtn.className = "small";
    addBtn.textContent = "품목 추가";
    addBtn.addEventListener("click", async () => {
      const text = addInput.value.trim();
      if (!text) return;
      await fetch(`${API}/${currentSlug}/categories/inventory/items`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
      });
      await refreshDetail();
    });
    addInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addBtn.click(); });
    addRow.append(addInput, addBtn);
    const csvBtn = document.createElement("button");
    csvBtn.className = "small inv-naver-btn";
    csvBtn.textContent = "엑셀(CSV)로 상품 불러오기";
    csvBtn.addEventListener("click", () => {
      const box = document.getElementById("inv-csv-box");
      box.style.display = box.style.display === "none" ? "block" : "none";
    });
    addRow.appendChild(csvBtn);
    container.appendChild(addRow);

    container.appendChild(buildInventoryCsvBox());

    // 필터 적용
    const visibleItems = items.filter((it) => {
      if (invFilter.onlyUnprepared && it.done) return false;
      if (invFilter.onlyUnloaded && it.loaded) return false;
      return true;
    });

    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "inv-empty";
      empty.textContent = "아직 등록된 품목이 없어요. 위에서 가져갈 상품을 하나씩 추가해주세요.";
      container.appendChild(empty);
      return;
    }
    if (visibleItems.length === 0) {
      const empty = document.createElement("div");
      empty.className = "inv-empty";
      empty.textContent = "필터 조건에 맞는 품목이 없어요.";
      container.appendChild(empty);
      return;
    }

    // 필터가 걸려있으면(화면에 전체 품목이 안 보이는 상태) 드래그 순서 변경은 꺼둠 —
    // 서버 reorder API가 전체 품목 id 배열을 요구해서, 필터링된 일부만으로는 순서가 꼬일 수 있음.
    const draggable = !invFilter.onlyUnprepared && !invFilter.onlyUnloaded;
    visibleItems.forEach((it) => container.appendChild(buildInventoryCard(it, { draggable })));
  }

  // 스마트스토어 어드민에서 내려받은 상품 목록 CSV를 올리면, 판매중인 상품이 쫙 나오고
  // 체크한 것만 "확인"으로 한 번에 추가하는 방식(네이버 API 연동 없이, 파일만으로 동작).
  function buildInventoryCsvBox() {
    const box = document.createElement("div");
    box.className = "inv-naver-box";
    box.id = "inv-csv-box";
    box.style.display = "none";
    box.innerHTML = `<div class="inv-naver-hint">스마트스토어 어드민 → 상품관리 → 상품 목록 엑셀 다운로드(CSV)로 받은 파일을 올려주세요. 판매중인 상품이 쫙 나오면 가져갈 것만 체크하고 확인을 누르면 돼요. 이미 추가한 상품은 다시 올려도 중복되지 않아요.</div>`;

    const fileRow = document.createElement("div");
    fileRow.className = "inv-naver-search";
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".csv,text/csv";
    const filterInput = document.createElement("input");
    filterInput.type = "text";
    filterInput.placeholder = "목록 안에서 찾기 (선택)";
    filterInput.style.display = "none";
    fileRow.append(fileInput, filterInput);

    const selectAllLabel = document.createElement("label");
    selectAllLabel.className = "inv-naver-selectall";
    selectAllLabel.style.display = "none";
    const selectAllCb = document.createElement("input");
    selectAllCb.type = "checkbox";
    selectAllLabel.append(selectAllCb, document.createTextNode(" 전체 선택"));

    const resultsEl = document.createElement("div");
    resultsEl.className = "inv-naver-results";
    resultsEl.innerHTML = `<div class="hint">CSV 파일을 선택해주세요.</div>`;

    let allRows = [];
    let rowEls = []; // { key, cb } — 체크박스 하나 토글할 때 목록 전체를 다시 그리지 않고(스크롤 유지) 전체선택 상태만 갱신하려고 기억해둠
    const checked = new Set(); // key: naverProductId
    // key: naverProductId -> 옵션 그룹 배열 [{ name, items:[{value,checked}], open }]
    // 네이버 상품페이지처럼 "밑식기"/"윗그릇" 같은 그룹별로 색상 등 값을 체크하고,
    // 그룹이 여러 개면 그룹끼리 조합(예: 핑크/핑크, 핑크/블루)해서 품목을 만듦.
    const optionGroups = new Map();
    const rowKey = (r) => r.naverProductId;

    const ensureGroups = (key) => {
      if (!optionGroups.has(key)) optionGroups.set(key, [{ name: "", items: [], open: true }]);
      return optionGroups.get(key);
    };

    // 그룹별 체크된 값들의 조합(카테시안 곱)을 "값1 / 값2" 형태 라벨 배열로 만듦.
    // 값이 하나도 안 체크된 그룹은 참여시키지 않음(전부 비어있으면 빈 배열 반환).
    const cartesianOptionCombos = (groups) => {
      const participating = groups.map((g) => g.items.filter((v) => v.checked).map((v) => v.value)).filter((arr) => arr.length > 0);
      if (participating.length === 0) return [];
      let combos = [[]];
      participating.forEach((values) => {
        const next = [];
        combos.forEach((combo) => values.forEach((v) => next.push([...combo, v])));
        combos = next;
      });
      return combos.map((combo) => combo.join(" / "));
    };

    // 옵션 있는 상품 한 줄에 붙는 "옵션 그룹 설정" UI — 그룹 추가/이름 변경/값 추가/체크를
    // 이 블록 안에서만 다시 그려서(전체 목록 재렌더 X) 스크롤과 다른 행 상태가 안 흔들리게 함.
    const buildOptionGroupsUI = (key) => {
      const wrap = document.createElement("div");
      wrap.className = "inv-optgroup-wrap";

      const render = () => {
        wrap.innerHTML = "";
        const groups = ensureGroups(key);
        groups.forEach((g, gIdx) => {
          const gEl = document.createElement("div");
          gEl.className = "inv-optgroup";

          const header = document.createElement("button");
          header.type = "button";
          header.className = "inv-optgroup-header";
          const checkedCount = g.items.filter((v) => v.checked).length;
          header.append(
            span("inv-optgroup-name", g.name.trim() || `옵션 그룹 ${gIdx + 1}`),
            span("inv-optgroup-count", g.items.length ? `${checkedCount}/${g.items.length}` : ""),
            span("inv-optgroup-chev", g.open ? "▲" : "▼"),
          );
          header.addEventListener("click", () => { g.open = !g.open; render(); });
          gEl.appendChild(header);

          if (g.open) {
            const body = document.createElement("div");
            body.className = "inv-optgroup-body";

            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.placeholder = "그룹명 (예: 밑식기) — 그룹이 하나뿐이면 안 적어도 돼요";
            nameInput.value = g.name;
            nameInput.addEventListener("input", () => { g.name = nameInput.value; });
            nameInput.addEventListener("change", () => {
              header.querySelector(".inv-optgroup-name").textContent = g.name.trim() || `옵션 그룹 ${gIdx + 1}`;
            });
            body.appendChild(nameInput);

            const addRow = document.createElement("div");
            addRow.className = "inv-optgroup-addrow";
            const valueInput = document.createElement("input");
            valueInput.type = "text";
            valueInput.placeholder = "값을 쉼표로 구분해서 입력 (예: 핑크, 블루, 그린)";
            const addValBtn = document.createElement("button");
            addValBtn.type = "button";
            addValBtn.className = "small";
            addValBtn.textContent = "값 추가";
            const commitValues = () => {
              const parts = valueInput.value.split(",").map((s) => s.trim()).filter(Boolean);
              parts.forEach((p) => { if (!g.items.some((it) => it.value === p)) g.items.push({ value: p, checked: true }); });
              if (parts.length) { valueInput.value = ""; render(); }
            };
            addValBtn.addEventListener("click", commitValues);
            valueInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); commitValues(); } });
            addRow.append(valueInput, addValBtn);
            body.appendChild(addRow);

            if (g.items.length) {
              const list = document.createElement("div");
              list.className = "inv-optgroup-list";
              g.items.forEach((v) => {
                const row = document.createElement("label");
                row.className = "inv-optgroup-item";
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = v.checked;
                cb.addEventListener("change", () => { v.checked = cb.checked; render(); });
                const delX = document.createElement("button");
                delX.type = "button";
                delX.className = "inv-optgroup-item-del";
                delX.textContent = "×";
                delX.addEventListener("click", () => { g.items = g.items.filter((x) => x !== v); render(); });
                row.append(cb, document.createTextNode(v.value), delX);
                list.appendChild(row);
              });
              body.appendChild(list);
            }

            if (groups.length > 1) {
              const delGroupBtn = document.createElement("button");
              delGroupBtn.type = "button";
              delGroupBtn.className = "small";
              delGroupBtn.textContent = "이 그룹 삭제";
              delGroupBtn.addEventListener("click", () => {
                optionGroups.set(key, groups.filter((x) => x !== g));
                render();
              });
              body.appendChild(delGroupBtn);
            }

            gEl.appendChild(body);
          }
          wrap.appendChild(gEl);
        });

        const addGroupBtn = document.createElement("button");
        addGroupBtn.type = "button";
        addGroupBtn.className = "small";
        addGroupBtn.textContent = "+ 옵션 그룹 추가 (예: 윗그릇)";
        addGroupBtn.addEventListener("click", () => {
          ensureGroups(key).push({ name: "", items: [], open: true });
          render();
        });
        wrap.appendChild(addGroupBtn);
      };
      render();
      return wrap;
    };
    const visibleRows = () => {
      const q = filterInput.value.trim().toLowerCase();
      return !q ? allRows : allRows.filter((r) => r.name.toLowerCase().includes(q));
    };

    const updateSelectAllState = () => {
      const rows = visibleRows();
      selectAllLabel.style.display = rows.length ? "" : "none";
      const checkedCount = rows.filter((r) => checked.has(rowKey(r))).length;
      selectAllCb.checked = rows.length > 0 && checkedCount === rows.length;
      selectAllCb.indeterminate = checkedCount > 0 && checkedCount < rows.length;
    };

    const renderList = () => {
      const rows = visibleRows();
      rowEls = [];
      resultsEl.innerHTML = "";
      if (rows.length === 0) {
        resultsEl.innerHTML = `<div class="hint">${filterInput.value.trim() ? "찾는 상품이 없어요." : "판매중인 상품이 없어요."}</div>`;
        updateSelectAllState();
        return;
      }
      rows.forEach((r) => {
        const key = rowKey(r);
        const row = document.createElement("div");
        row.className = "inv-naver-result-row";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = checked.has(key);
        cb.addEventListener("change", () => { if (cb.checked) checked.add(key); else checked.delete(key); updateSelectAllState(); });
        const info = document.createElement("span");
        info.className = "info";
        info.textContent = r.name;
        if (r.hasOptions) {
          info.appendChild(document.createTextNode(" "));
          info.appendChild(span("inv-naver-opt-badge", "옵션있음"));
        }
        const price = document.createElement("span");
        price.className = "price";
        price.textContent = r.price ? `${Number(r.price).toLocaleString()}원` : "";
        row.append(cb, info, price);
        if (r.hasOptions) {
          ensureGroups(key);
          const optWrap = document.createElement("div");
          optWrap.className = "inv-naver-opt-wrap";
          optWrap.appendChild(buildOptionGroupsUI(key));
          row.appendChild(optWrap);
        }
        resultsEl.appendChild(row);
        rowEls.push({ key, cb });
      });
      updateSelectAllState();
    };
    filterInput.addEventListener("input", renderList);
    selectAllCb.addEventListener("change", () => {
      const want = selectAllCb.checked;
      rowEls.forEach(({ key, cb }) => {
        if (want) checked.add(key); else checked.delete(key);
        cb.checked = want;
      });
      updateSelectAllState();
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      resultsEl.innerHTML = `<div class="hint">읽는 중...</div>`;
      filterInput.style.display = "none";
      try {
        const text = await file.text();
        const rows = csvRowsToProducts(text);
        if (rows === null) {
          resultsEl.innerHTML = `<div class="error">스마트스토어 상품 목록 CSV가 맞는지 확인해주세요(상품명/상품번호 칼럼을 찾을 수 없어요).</div>`;
          return;
        }
        allRows = rows;
        checked.clear();
        optionGroups.clear();
        filterInput.style.display = allRows.length ? "" : "none";
        renderList();
      } catch (e) {
        resultsEl.innerHTML = `<div class="error">파일을 읽는 중 오류가 발생했어요.</div>`;
      }
    });

    const actions = document.createElement("div");
    actions.className = "inv-naver-actions";
    const addBtn = document.createElement("button");
    addBtn.className = "small";
    addBtn.textContent = "확인 (체크한 상품만 추가)";
    addBtn.addEventListener("click", async () => {
      const selected = allRows.filter((r) => checked.has(rowKey(r)));
      if (selected.length === 0) { alert("가져갈 상품을 체크해주세요."); return; }
      // 옵션 그룹에서 체크한 값이 있으면 그룹끼리 조합(예: 핑크/핑크)해서 품목을 따로 만들고,
      // 하나도 안 체크했으면(옵션 없는 상품 포함) 상품명 그대로 하나만 추가.
      const items = [];
      selected.forEach((r) => {
        const combos = r.hasOptions ? cartesianOptionCombos(optionGroups.get(rowKey(r)) || []) : [];
        if (combos.length === 0) {
          items.push({ naverProductId: r.naverProductId, naverOptionId: "", name: r.name, price: r.price });
        } else {
          combos.forEach((label) => {
            items.push({ naverProductId: r.naverProductId, naverOptionId: label, optionName: label, name: r.name, price: r.price });
          });
        }
      });
      const res = await fetch(`${API}/${currentSlug}/categories/inventory/naver-import`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items }),
      });
      const body = await res.json();
      if (res.ok && body.skipped > 0) {
        alert(`${body.added}개 추가, ${body.skipped}개는 이미 있어서 건너뛰었어요.`);
      }
      await refreshDetail();
    });
    actions.appendChild(addBtn);

    box.append(fileRow, selectAllLabel, resultsEl, actions);
    return box;
  }

  // 스마트스토어 상품 목록 CSV 파싱 — 따옴표로 감싼 칸 안의 줄바꿈/쉼표도 올바르게 처리.
  function parseCsv(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1); // BOM 제거
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\r") { /* \n에서 처리 */ }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  // 판매중 상품만 { naverProductId, naverOptionId, name, price, hasOptions } 로 뽑아냄.
  // hasOptions: 네이버에 사이즈/색상 등 옵션이 걸려있는 상품(CSV엔 "옵션=Y" 표시만 있고
  // 실제 옵션명은 없음) — 체크리스트에서 직접 옵션명을 입력할 수 있게 표시해줄 때 씀.
  // 칼럼 이름을 못 찾으면(다른 양식의 CSV) null을 돌려줘서 안내 메시지를 보여줄 수 있게 함.
  function csvRowsToProducts(text) {
    const rows = parseCsv(text).filter((r) => r.length > 1 || (r[0] ?? "").trim() !== "");
    if (rows.length === 0) return [];
    const header = rows[0];
    const iName = header.indexOf("상품명");
    const iProductId = header.indexOf("상품번호(스마트스토어)");
    if (iName === -1 || iProductId === -1) return null;
    const iStatus = header.indexOf("판매상태");
    const iSalePrice = header.indexOf("판매가");
    const iDiscountPrice = header.indexOf("할인가");
    const iOption = header.indexOf("옵션");
    const toNumber = (v) => {
      const n = Number(String(v ?? "").replace(/[^0-9]/g, ""));
      return Number.isFinite(n) && n > 0 ? n : null;
    };
    const out = [];
    const seen = new Set();
    for (let r = 1; r < rows.length; r++) {
      const cols = rows[r];
      const name = (cols[iName] || "").trim();
      if (!name) continue;
      if (iStatus !== -1 && (cols[iStatus] || "").trim() !== "판매중") continue;
      const productId = (cols[iProductId] || "").trim() || name;
      if (seen.has(productId)) continue;
      seen.add(productId);
      const price = toNumber(cols[iDiscountPrice]) ?? toNumber(cols[iSalePrice]);
      const hasOptions = iOption !== -1 && (cols[iOption] || "").trim() === "Y";
      out.push({ naverProductId: productId, naverOptionId: "", name, price, hasOptions });
    }
    return out;
  }

  function buildInventoryCard(it, opts = {}) {
    const card = document.createElement("div");
    card.className = "inv-card";
    card.dataset.itemId = it.id;

    // 품목명 + 드래그 손잡이 + 삭제
    const head = document.createElement("div");
    head.className = "inv-card-head";
    if (opts.draggable) {
      const handle = document.createElement("div");
      handle.className = "inv-drag-handle";
      handle.textContent = "⠿";
      handle.title = "드래그해서 순서 변경";
      setupCardDrag(card, handle);
      head.appendChild(handle);
    }
    const textEl = document.createElement("span");
    textEl.className = "txt" + (it.done ? " done" : "");
    textEl.textContent = it.text;
    textEl.addEventListener("click", () => startEditItem("inventory", it, textEl));
    const delBtn = document.createElement("button");
    delBtn.className = "del";
    delBtn.textContent = "삭제";
    delBtn.addEventListener("click", () => deleteItem("inventory", it.id));
    head.append(textEl, delBtn);
    card.appendChild(head);

    const saveField = (field, value) => saveInventoryItem(it.id, { [field]: value });

    // 옵션(색상/사이즈 등) — 한 상품에 옵션이 여러 개면 이 품목이 어떤 옵션인지 적어두는 칸
    const optionInput = document.createElement("input");
    optionInput.type = "text";
    optionInput.className = "inv-option-input";
    optionInput.placeholder = "옵션 (예: 레드, M사이즈) — 선택";
    optionInput.value = it.optionLabel || "";
    optionInput.addEventListener("change", () => saveField("optionLabel", optionInput.value));
    card.appendChild(optionInput);

    // 준비 예정 수량: ①박스 하나당 PCS ②박스(CTN) 수량 → 자동계산 ③추가 PC(낱개)
    const planWrap = document.createElement("div");
    planWrap.className = "inv-plan-wrap";
    planWrap.innerHTML = `<span class="qlbl">예정</span>`;

    const boxCapRow = document.createElement("div");
    boxCapRow.className = "inv-boxcap-row";
    const boxQtyInput = numInput(it.boxQty, "20");
    boxQtyInput.classList.add("inv-boxcap-input");
    boxQtyInput.addEventListener("change", () => saveField("boxQty", boxQtyInput.value));
    boxCapRow.append(span("unit", "1 CTN ="), boxQtyInput, span("unit", "PCS"));

    const ctnRow = document.createElement("div");
    ctnRow.className = "inv-ctn-row";
    const ctnWrap = numStepper(it.ctnPlanned, "0");
    const ctnPlannedInput = ctnWrap.input;
    ctnPlannedInput.addEventListener("change", () => saveField("ctnPlanned", ctnPlannedInput.value));
    const subtotalEl = span("inv-subtotal-pc", "");
    ctnRow.append(ctnWrap, span("unit", "CTN"), subtotalEl);

    const extraRow = document.createElement("div");
    extraRow.className = "inv-extra-row";
    const pcWrap = numStepper(it.pcPlanned, "0");
    const pcPlannedInput = pcWrap.input;
    pcPlannedInput.addEventListener("change", () => saveField("pcPlanned", pcPlannedInput.value));
    extraRow.append(span("unit", "추가 PC(낱개)"), pcWrap);

    const totalPcEl = span("inv-total-pc", "");
    const updateCalc = () => {
      const box = Number(boxQtyInput.value) || 0;
      const ctn = Number(ctnPlannedInput.value) || 0;
      const pc = Number(pcPlannedInput.value) || 0;
      if (box > 0) {
        subtotalEl.textContent = `= 자동계산 ${ctn * box} PCS`;
        subtotalEl.style.display = "";
        totalPcEl.textContent = `→ 총 ${ctn * box + pc} PC`;
        totalPcEl.style.display = "";
      } else {
        subtotalEl.style.display = "none";
        totalPcEl.style.display = "none";
      }
    };
    [boxQtyInput, ctnPlannedInput, pcPlannedInput].forEach((el) => el.addEventListener("input", updateCalc));
    updateCalc();

    planWrap.append(boxCapRow, ctnRow, extraRow, totalPcEl);
    card.appendChild(planWrap);

    // 실제 준비 수량 (CTN / PC)
    const actualRow = document.createElement("div");
    actualRow.className = "inv-qty-row";
    actualRow.innerHTML = `<span class="qlbl">실제</span>`;
    const ctnActualInput = numInput(it.ctnActual, "CTN");
    const pcActualInput = numInput(it.pcActual, "PC");
    ctnActualInput.addEventListener("change", () => { saveField("ctnActual", ctnActualInput.value); });
    pcActualInput.addEventListener("change", () => { saveField("pcActual", pcActualInput.value); });
    actualRow.append(ctnActualInput, span("unit", "CTN"), pcActualInput, span("unit", "PC"));
    const ctnDiff = (it.ctnActual ?? null) !== null && (it.ctnPlanned ?? null) !== null ? it.ctnActual - it.ctnPlanned : 0;
    const pcDiff = (it.pcActual ?? null) !== null && (it.pcPlanned ?? null) !== null ? it.pcActual - it.pcPlanned : 0;
    if (ctnDiff !== 0 || pcDiff !== 0) {
      actualRow.appendChild(span("inv-diff", `차이: CTN ${ctnDiff > 0 ? "+" : ""}${ctnDiff} / PC ${pcDiff > 0 ? "+" : ""}${pcDiff}`));
    }
    card.appendChild(actualRow);

    // 준비완료 / 차량적재완료 체크 — 가장 크게, 누르기 쉽게
    const checks = document.createElement("div");
    checks.className = "inv-checks";
    const prepLabel = document.createElement("label");
    prepLabel.className = "inv-check-btn" + (it.done ? " checked" : "");
    const prepCb = document.createElement("input");
    prepCb.type = "checkbox";
    prepCb.checked = !!it.done;
    prepCb.addEventListener("change", () => {
      prepLabel.classList.toggle("checked", prepCb.checked);
      toggleItem("inventory", it.id, prepCb.checked);
    });
    prepLabel.append(prepCb, document.createTextNode("준비완료"));

    const loadLabel = document.createElement("label");
    loadLabel.className = "inv-check-btn" + (it.loaded ? " checked" : "");
    const loadCb = document.createElement("input");
    loadCb.type = "checkbox";
    loadCb.checked = !!it.loaded;
    loadCb.addEventListener("change", async () => {
      if (loadCb.checked && !it.done) {
        if (!confirm("아직 '준비완료' 체크가 안 된 품목이에요. 그래도 차량 적재 완료로 표시할까요?")) {
          loadCb.checked = false;
          return;
        }
      }
      loadLabel.classList.toggle("checked", loadCb.checked);
      await saveInventoryItem(it.id, { loaded: loadCb.checked });
    });
    loadLabel.append(loadCb, document.createTextNode("차량적재완료"));
    checks.append(prepLabel, loadLabel);
    card.appendChild(checks);

    // 메모 (부분 적재 등)
    const noteInput = document.createElement("input");
    noteInput.type = "text";
    noteInput.className = "inv-note";
    noteInput.placeholder = "메모 (예: 2박스만 우선 적재, 나머지는 당일 추가)";
    noteInput.value = it.note || "";
    noteInput.addEventListener("change", () => saveField("note", noteInput.value));
    card.appendChild(noteInput);

    return card;
  }

  // 마우스/터치 공용(Pointer Events) 드래그 순서 변경. 손잡이를 눌러서 드래그하면
  // 지나치는 카드와 자리를 바로 맞바꾸고, 손을 떼면 바뀐 순서를 서버에 저장함.
  function setupCardDrag(card, handle) {
    let dragging = false;

    const onPointerMove = (e) => {
      if (!dragging) return;
      const container = card.parentElement;
      if (!container) return;
      const cards = [...container.querySelectorAll(":scope > .inv-card")];
      for (const sib of cards) {
        if (sib === card) continue;
        const rect = sib.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        const cardIsAfterSib = !!(sib.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_FOLLOWING);
        if (e.clientY < mid && cardIsAfterSib) { container.insertBefore(card, sib); break; }
        if (e.clientY >= mid && !cardIsAfterSib) { container.insertBefore(card, sib.nextSibling); break; }
      }
    };

    const finishDrag = async (e) => {
      if (!dragging) return;
      dragging = false;
      card.classList.remove("inv-dragging");
      document.body.style.userSelect = "";
      document.removeEventListener("pointermove", onPointerMove);
      document.removeEventListener("pointerup", finishDrag);
      document.removeEventListener("pointercancel", finishDrag);
      const container = card.parentElement;
      if (!container) return;
      const ids = [...container.querySelectorAll(":scope > .inv-card")].map((c) => c.dataset.itemId);
      await fetch(`${API}/${currentSlug}/categories/inventory/reorder`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ itemIds: ids }),
      });
      await refreshDetail();
    };

    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      dragging = true;
      card.classList.add("inv-dragging");
      document.body.style.userSelect = "none";
      document.addEventListener("pointermove", onPointerMove);
      document.addEventListener("pointerup", finishDrag);
      document.addEventListener("pointercancel", finishDrag);
    });
  }

  function numInput(value, placeholder) {
    const input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.placeholder = placeholder;
    if (value !== null && value !== undefined) input.value = value;
    return input;
  }

  // 숫자 입력 + 양옆 -/+ 버튼(스테퍼). 버튼 눌러서 1씩 조절하거나, 가운데 칸에 직접 타이핑도 가능.
  // 반환된 div에 .input으로 실제 <input>을 바로 꺼내 쓸 수 있게 붙여둠.
  function numStepper(value, placeholder) {
    const wrap = document.createElement("div");
    wrap.className = "num-stepper";
    const input = numInput(value, placeholder);
    input.classList.add("num-stepper-input");
    const step = (delta) => {
      const next = Math.max(0, (Number(input.value) || 0) + delta);
      input.value = next;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };
    const minusBtn = document.createElement("button");
    minusBtn.type = "button";
    minusBtn.className = "num-stepper-btn";
    minusBtn.textContent = "−";
    minusBtn.addEventListener("click", () => step(-1));
    const plusBtn = document.createElement("button");
    plusBtn.type = "button";
    plusBtn.className = "num-stepper-btn";
    plusBtn.textContent = "+";
    plusBtn.addEventListener("click", () => step(1));
    wrap.append(minusBtn, input, plusBtn);
    wrap.input = input;
    return wrap;
  }

  function span(className, text) {
    const el = document.createElement("span");
    el.className = className;
    el.textContent = text;
    return el;
  }

  async function saveInventoryItem(itemId, fields) {
    await fetch(`${API}/${currentSlug}/categories/inventory/items/${itemId}`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(fields),
    });
    await refreshDetail();
  }

  // ===== 집기 탭: 분류(그룹)별로 묶어서 품목·수량·준비완료 관리 =====
  const SUPPLIES_FIXED_GROUPS = ["부스 꾸미기", "작업 도구", "전기용품"];

  async function addSuppliesItem(group, textInput) {
    const text = textInput.value.trim();
    if (!text) return;
    await fetch(`${API}/${currentSlug}/categories/supplies/items`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, group }),
    });
    await refreshDetail();
  }

  function buildGroupAddRow(groupName) {
    const row = document.createElement("div");
    row.className = "sup-add-row";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "품목명";
    const btn = document.createElement("button");
    btn.className = "small";
    btn.textContent = "+ 품목 추가";
    btn.addEventListener("click", () => addSuppliesItem(groupName, input));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") btn.click(); });
    row.append(input, btn);

  function buildSuppliesItemRow(it) {
    const row = document.createElement("div");
    row.className = "sup-item-row";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!it.done;
    cb.addEventListener("change", () => toggleItem("supplies", it.id, cb.checked));

    const textEl = document.createElement("span");
    textEl.className = "txt" + (it.done ? " done" : "");
    textEl.textContent = it.text;
    textEl.addEventListener("click", () => startEditItem("supplies", it, textEl));

    const qtyInput = document.createElement("input");
    qtyInput.type = "number";
    qtyInput.min = "0";
    qtyInput.placeholder = "수량";
    if (it.qty !== null && it.qty !== undefined) qtyInput.value = it.qty;
    qtyInput.addEventListener("change", async () => {
      await fetch(`${API}/${currentSlug}/categories/supplies/items/${it.id}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ qty: qtyInput.value }),
      });
      await refreshDetail();
    });

    const delBtn = document.createElement("button");
    delBtn.className = "del";
    delBtn.textContent = "삭제";
    delBtn.addEventListener("click", () => deleteItem("supplies", it.id));

    row.append(cb, textEl, qtyInput, span("unit", "개"), delBtn);
    return row;

  function buildSuppliesGroupSection(groupName, items, { deletable = false } = {}) {
    const box = document.createElement("div");
    box.className = "sup-group";
    const done = items.filter((it) => it.done).length;

    const head = document.createElement("div");
    head.className = "sup-group-head";
    head.innerHTML = `<span class="name">${escapeHtml(groupName)}<span class="count">(${done}/${items.length})</span></span>`;
    if (deletable) {
      const delGroupBtn = document.createElement("button");
      delGroupBtn.className = "del-group";
      delGroupBtn.textContent = "분류 삭제";
      delGroupBtn.addEventListener("click", async () => {
        if (!confirm(`'${groupName}' 분류와 그 안의 품목 ${items.length}개를 전부 삭제할까요?`)) return;
        for (const it of items) {
          await fetch(`${API}/${currentSlug}/categories/supplies/items/${it.id}`, { method: "DELETE" });
        }
        await refreshDetail();
      });
      head.appendChild(delGroupBtn);
    }
    box.appendChild(head);

    items.forEach((it) => box.appendChild(buildSuppliesItemRow(it)));
    box.appendChild(buildGroupAddRow(groupName));
    return box;

  function renderSuppliesPanel(container, cat) {
    const byGroup = new Map();
    cat.items.forEach((it) => {
      const g = it.group || "기타";
      if (!byGroup.has(g)) byGroup.set(g, []);
      byGroup.get(g).push(it);

    // 고정 분류(어느 브랜드든 공통) — 품목이 없어도 항상 보여줌
    SUPPLIES_FIXED_GROUPS.forEach((g) => {
      container.appendChild(buildSuppliesGroupSection(g, byGroup.get(g) || [], { deletable: false }));
      byGroup.delete(g);

  // ===== 철수 정산 탭: 남은 재고 / 일별 매출 / 판매내역 업로드(베타) / 개선사항 =====

    const sec = document.createElement("div");
    sec.className = "settle-section";
    sec.innerHTML = `<div class="settle-section-title">① 남은 재고</div>`;

    const items = invCat ? invCat.items : [];

      const hint = document.createElement("div");
      hint.className = "hint";
      hint.style.margin = "0";
      hint.textContent = "'상품 재고' 탭에 등록된 품목이 없어요. 먼저 그쪽에서 가져갈 상품을 등록해주세요.";
      sec.appendChild(hint);
      container.appendChild(sec);
      return;
    }

    items.forEach((it) => {
      const row = document.createElement("div");
      row.className = "settle-row";

      const takenCtn = it.ctnActual ?? it.ctnPlanned ?? null;
      const takenPc = it.pcActual ?? it.pcPlanned ?? null;
      const takenText = (takenCtn !== null || takenPc !== null)
        ? `가져간 수량: ${takenCtn ?? 0} CTN / ${takenPc ?? 0} PC`
        : "가져간 수량: 미입력";

      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = it.text;

      const takenEl = document.createElement("span");
      takenEl.className = "taken";
      takenEl.textContent = takenText;

      const ctnInput = numInput(it.ctnRemaining, "CTN");
      const pcInput = numInput(it.pcRemaining, "PC");

      const save = async () => {
        await fetch(`${API}/${currentSlug}/categories/inventory/items/${it.id}`, {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ctnRemaining: ctnInput.value, pcRemaining: pcInput.value }),
        });
        await refreshDetail();
      };
      ctnInput.addEventListener("change", save);
      pcInput.addEventListener("change", save);

      row.append(nameEl, takenEl, ctnInput, span("unit", "CTN"), pcInput, span("unit", "PC"));

      const hasRemaining = it.ctnRemaining !== null && it.ctnRemaining !== undefined
        || it.pcRemaining !== null && it.pcRemaining !== undefined;
      if (hasRemaining && (takenCtn !== null || takenPc !== null)) {
        const soldCtn = (takenCtn || 0) - (it.ctnRemaining || 0);
        const soldPc = (takenPc || 0) - (it.pcRemaining || 0);
        row.appendChild(span("sold-est", `→ 판매 추정: CTN ${soldCtn} / PC ${soldPc}`));
      }
      sec.appendChild(row);

    container.appendChild(sec);

  function renderDailyRevenueSection(container, ev) {
    const sec = document.createElement("div");
    sec.className = "settle-section";
    const title = document.createElement("div");
    title.className = "settle-section-title";
    title.textContent = "② 일별 매출";
    sec.appendChild(title);

    const revenue = (ev.settlement && ev.settlement.revenue) || {};
    const grid = document.createElement("div");
    grid.className = "settle-revenue-grid";

    const mk = (key, label) => {
      const wrap = document.createElement("div");
      const lbl = document.createElement("label");
      lbl.textContent = label;
      const input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.placeholder = "원";
      if (revenue[key] !== null && revenue[key] !== undefined) input.value = revenue[key];
      wrap.append(lbl, input);
      return { wrap, input };
    };
    const fri = mk("fri", "금요일");

    grid.append(fri.wrap, sat.wrap, sun.wrap);

    total.className = "settle-revenue-total";

      const n = (v) => (v === "" ? 0 : Number(v) || 0);
      return n(fri.input.value) + n(sat.input.value) + n(sun.input.value);
    };
    total.textContent = `3일 합계: ${sumFn().toLocaleString()}원`;

      await fetch(`${API}/${currentSlug}/settlement`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [key]: input.value }),
      });
      total.textContent = `3일 합계: ${sumFn().toLocaleString()}원`;

  function renderPosUploadSection(container, ev) {
    const sec = document.createElement("div");
    sec.className = "settle-section";
    const title = document.createElement("div");
    title.className = "settle-section-title";
    title.textContent = "③ 품목별 판매 내역";
    sec.appendChild(title);

    const box = document.createElement("div");
    box.className = "settle-pos-upload";
    box.innerHTML = `<div class="settle-beta-hint">베타 기능입니다. 엑셀 파일 형식에 따라 일부 항목을 불러오지 못할 수 있으니, 정리 결과를 원본과 확인해주세요.</div>`;

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = ".xlsx,.xls";
    const uploadBtn = document.createElement("button");
    uploadBtn.className = "small";
    uploadBtn.style.marginLeft = "8px";
    uploadBtn.textContent = "판매내역 올리기";
    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) { alert("엑셀 파일을 먼저 선택해주세요."); return; }
      uploadBtn.disabled = true;
      uploadBtn.textContent = "읽는 중...";
      try {
        const base64 = await fileToBase64(file);
        const res = await fetch(`${API}/${currentSlug}/settlement/pos-upload`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fileName: file.name, fileDataBase64: base64 }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.error || "업로드에 실패했어요.");
        }
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "판매내역 올리기";
        await refreshDetail();
      }
    });
    box.append(fileInput, uploadBtn);

    const pos = ev.settlement && ev.settlement.pos;
    if (pos) {
      const meta = document.createElement("div");
      meta.className = "hint";
      meta.style.marginTop = "10px";
      meta.textContent = `마지막 업로드: ${escapeHtml(pos.fileName || "")} (${new Date(pos.uploadedAt).toLocaleString("ko-KR")})`;
      box.appendChild(meta);

      if (!pos.recognized) {
        const warn = document.createElement("div");
        warn.className = "settle-uncertain";
        warn.textContent = pos.message || "표 형식을 인식하지 못했어요.";
        box.appendChild(warn);
      } else if (pos.summary && pos.summary.length > 0) {
        const table = document.createElement("table");
        table.className = "settle-table";
        table.innerHTML = `
          <thead><tr><th>품목</th><th style="text-align:right">수량</th><th style="text-align:right">금액</th></tr></thead>
          <tbody>${pos.summary.map((r) => `<tr><td>${escapeHtml(r.name)}</td><td class="num">${r.qty.toLocaleString()}</td><td class="num">${r.amount.toLocaleString()}원</td></tr>`).join("")}</tbody>
        `;
        box.appendChild(table);
      }

      if (pos.uncertain && pos.uncertain.length > 0) {
        const warn = document.createElement("div");
        warn.className = "settle-uncertain";
        warn.innerHTML = `⚠️ ${escapeHtml(pos.message || "일부 행을 자동으로 읽지 못했어요.")} 원본에서 직접 확인해주세요.<pre>${escapeHtml(JSON.stringify(pos.uncertain.slice(0, 15), null, 1))}</pre>`;
        box.appendChild(warn);
      }
    }

    sec.appendChild(box);
    container.appendChild(sec);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1] || "");
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
